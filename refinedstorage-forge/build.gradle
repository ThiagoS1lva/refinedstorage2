// Unofficial Forge port of Refined Storage.
// Upstream: https://github.com/refinedmods/refinedstorage2 (MIT)
//
// Target: Forge 26.1.2 (same Minecraft as upstream v3.2.1 on NeoForge 26.1.2),
// so no vanilla drift needs porting - only the loader adaptation.
// Scaffolding follows the official Forge MDK for 26.1.2-64.1.3 (ForgeGradle 7).

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.29,8)'
}

version = '3.2.1-forge-mvp'
group = 'com.refinedmods.refinedstorage'

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Compile the loader-independent common sources (incl. API modules) together with the
// Forge platform sources, all against Minecraft 26.1.2 (single toolchain, single mapping).
sourceSets.main.java.srcDirs = [
    'src/main/java',
    '../refinedstorage-common/src/main/java',
    '../refinedstorage-common-api/src/main/java',
    '../refinedstorage-core-api/src/main/java',
    '../refinedstorage-resource-api/src/main/java',
    '../refinedstorage-storage-api/src/main/java',
    '../refinedstorage-network-api/src/main/java',
    '../refinedstorage-network/src/main/java',
    '../refinedstorage-query-parser/src/main/java',
    '../refinedstorage-autocrafting-api/src/main/java'
]

// Resources: ours, common hand-written assets, and common generated outputs
// (datagen writes Forge-flavored files there, mirroring the upstream workflow
// where each loader overwrites the shared generated tree with its own flavor).
sourceSets.main.resources.srcDirs = [
    'src/main/resources',
    '../refinedstorage-common/src/main/resources',
    '../refinedstorage-common/src/generated/resources'
]

minecraft {
    accessTransformer = true

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'refinedstorage', '--all', '--output', layout.projectDirectory.dir('../refinedstorage-common/src/generated/resources'), '--existing', layout.projectDirectory.dir('../refinedstorage-common/src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.1.2-64.1.3')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'

    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'org.apiguardian:apiguardian-api:1.1.2'
    compileOnly 'org.lwjgl:lwjgl-glfw:3.4.3'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    options.encoding = 'UTF-8'
}
